<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- links -->
     <link rel="stylesheet" href="./assets/style/cart.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
   <main>
        <section>
            <div class="head">
                <nav>
                    <!-- logo -->
                    <h1><i>BookLovers</i></h1>
                    
                </nav>
            </div>
            <div class="content">
                <div class="tab-pane " id="register" role="tabpanel">
                        <div class="card mx-auto p-4 shadow-lg text-white" style="max-width: 420px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(137, 43, 226, 0.5); border-radius: 12px;">
                            <h2 class="text-center mb-4">Register</h2>
                            <form action="/index.html">
                                <div class="mb-3">
                                    <label for="regName" class="form-label text-light">Full Name</label>
                                    <input type="text" class="form-control" id="regName" placeholder="John Doe" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regEmail" class="form-label text-light">Email address</label>
                                    <input type="email" class="form-control" id="regEmail" placeholder="name@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="regPassword" class="form-label text-light">Password</label>
                                    <input type="password" class="form-control" id="regPassword" placeholder="Create password" required>
                                </div>
                                <div class="mb-3">
                                    <label for="confirmPassword" class="form-label text-light">Confirm Password</label>
                                    <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required>
                                </div>
                                
                                <button type="submit" class="btn text-white w-100 fw-bold" style="background-color: blueviolet;">Create Account</button>
                            </form>
                        </div>
                    </div>
                    
                    
                
            </div>

            <div class="footer"></div>

        </section>
    </main> 
</body>
</html>
