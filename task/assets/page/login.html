<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- links -->
     <link rel="stylesheet" href="./assets/style/cart.css">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>
    <main>
        <section>
            <div class="head">
                <nav>
                    <!-- logo -->
                    <h1><i>BookLovers</i></h1>
                    <!--list  -->
                    
                </nav>
            </div>
            <div class="content">
               <div class="tab-pane fade show active" id="login" role="tabpanel">
                        <div class="card mx-auto p-4 shadow-lg text-white" style="max-width: 420px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(137, 43, 226, 0.5); border-radius: 12px;">
                            <h2 class="text-center mb-4">Login</h2>
                            <form>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label text-light">Email address</label>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="name@example.com" required>
                                </div>
                                <div class="mb-3">
                                    <label for="loginPassword" class="form-label text-light">Password</label>
                                    <input type="password" class="form-control" id="loginPassword" placeholder="Enter password" required>
                                </div>
                                <div class="mb-3 form-check">
                                    <input type="checkbox" class="form-check-input" id="rememberMe">
                                    <label class="form-check-label text-light" for="rememberMe">Remember me</label>
                                </div>
                                <button type="submit" class="btn text-white w-100 fw-bold" style="background-color: blueviolet;">Sign In</button>
                            </form>
                        </div>
                    </div>

            </div>

            <div class="footer"></div>

        </section>
    </main>
</body>
</html>
