<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mycart</title>
    <link rel="stylesheet" href="./assets/style/cart.css">
</head>

<body>
    <main>
        <section>
            <div class="head">
                <nav>
                    <!-- logo -->
                    <h1><i>BookLovers</i></h1>
                    <!--list  -->
                    <ul class="myList">
                        <li><a href="/index.html">Home</a></li>
                        <li><a href="#products">products</a></li>
                        <li><a href="#contact us">contact us</a></li>
                        <li><a href="./assets/page/cart.html">cart</a></li>

                    </ul>

                    <!-- btns -->
                    <div class="btns">
                        <button class="log">log in</button>
                        <button class="sign">sign in</button>
                    </div>
                </nav>
            </div>
            <div class="content">
                <div class="part2" id="cart"></div>

            </div>

            <div class="footer"></div>

        </section>
    </main>
    <script>
        let cart = JSON.parse(localStorage.getItem("cart")) || [];
        const cartdiv = document.getElementById("cart");
        cartdiv.innerHTML="";
        cart.forEach((item,index) => {
            cartdiv.innerHTML += `
            <div class="card">
            <img src="${item.image}" class="book-img">
            <h3>${item.title}</h3>
            <p>${item.desc}</p>
            <button class="delete-btn" data-index="${index}">Remove</button>
            </div>
            `;
        });
        document.addEventListener("click", function (e) {
    const btn = e.target.closest(".delete-btn");
    if (!btn) return;

    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const index = btn.dataset.index;

    cart.splice(index, 1); // remove item
    localStorage.setItem("cart", JSON.stringify(cart));

    location.reload(); // simple refresh (easy + safe)
});

    </script>
</body>

</html>
